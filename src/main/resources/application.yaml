ses:
  rate: 5000

customName: batchJava

spring:
  mail:
    host: smtp.gmail.com
    port: 587
    username:
    password:
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  h2:
    console:
      enabled: true
      path: /h2-console
  application:
    name: task-reminder-demo
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: true
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.hibernate.type.descriptor.sql: trace
    org.hibernate.type.descriptor.sql.BasicBinder: trace
server:
  port: 9001


management:
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: mappings

info:
  app:
    name: custom-name
    version: 1.0.1

